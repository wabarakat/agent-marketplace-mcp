[project]
name = "agent-marketplace-mcp"
version = "0.1.1"
description = "MCP server for the Agent Data Marketplace: search data sellers and request data."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "wabarakat" }]
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3", "httpx>=0.27"]
keywords = ["mcp", "model-context-protocol", "ai-agents", "data-marketplace", "datasets"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://dlfyresearch.com"
Repository = "https://github.com/wabarakat/agent-marketplace-mcp"
Issues = "https://github.com/wabarakat/agent-marketplace-mcp/issues"

[project.scripts]
agent-marketplace-mcp = "agent_marketplace_mcp:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agent_marketplace_mcp.py"]

[tool.hatch.build.targets.sdist]
only-include = ["agent_marketplace_mcp.py", "README.md", "LICENSE", "pyproject.toml"]
